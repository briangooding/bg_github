# Generate the Xcode project with:  xcodegen generate
name: FavoritesSync
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  FavoritesSync:
    type: application
    platform: iOS
    sources:
      - FavoritesSync
    settings:
      base:
        PRODUCT_NAME: FavoritesSync
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: FavoritesSync/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
