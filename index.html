<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brian's Apps</title>
<link rel="icon" href="golden-hour/icon-192.png">
<style>
  /* Layout: one narrow column of two large app links. */
  :root {
    --bg: #faf6f1;
    --card: #ffffff;
    --text: #2b2230;
    --muted: #6d6373;
    --line: #ebe2d8;
    --accent: #d98a1c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17111d; --card: #221a2a; --text: #f3ebf5; --muted: #ad9fb5; --line: #362a40; --accent: #f0ad4b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17111d; --card: #221a2a; --text: #f3ebf5; --muted: #ad9fb5; --line: #362a40; --accent: #f0ad4b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 520px; margin: 0 auto; display: grid; gap: 12px;
    padding-inline: 16px;
    padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: 1.5rem; margin: 0 0 8px; text-wrap: balance; }
  a.app {
    display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center;
    padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  a.app:hover { border-color: var(--accent); }
  a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.app img { width: 56px; height: 56px; border-radius: 12px; display: block; }
  .name { font-weight: 700; font-size: 1.1rem; }
  .desc { color: var(--muted); font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <a class="app" href="golden-hour/">
    <img src="golden-hour/icon-192.png" alt="">
    <span><span class="name">Golden Hour</span><br>
      <span class="desc">Countdown, map and reminders for golden hour where you are.</span></span>
  </a>
  <a class="app" href="nearby-owners/">
    <img src="nearby-owners/icon-192.png" alt="">
    <span><span class="name">Nearby Owners</span><br>
      <span class="desc">Flags non owner-occupied homes near you in Tarrant County.</span></span>
  </a>
</main>
<script>
  // Golden Hour used to live at this address with a service worker covering the whole site.
  // Replace it with sw.js here, which removes itself and its cached files.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration('./').then((reg) => {
      if (reg && new URL(reg.scope).pathname === new URL('./', location.href).pathname) reg.update().catch(() => {});
    }).catch(() => {});
  }
</script>
</body>
</html>
